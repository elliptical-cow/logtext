[package]
name = "logtext"
version = "0.8.5"
description = "A local Markdown-first knowledge workspace for notes and tasks using backlinks as semantic tags."
authors = ["Jens"]
license = "AGPL-3.0-only"
repository = "https://github.com/elliptical-cow/logtext"
homepage = "https://github.com/elliptical-cow/logtext"
readme = "../README.md"
edition = "2021"
default-run = "Logtext"
autobins = false

[[bin]]
name = "Logtext"
path = "src/main.rs"

[[bin]]
name = "logtext-import-logseq"
path = "src/bin/logtext-import-logseq.rs"

[lib]
name = "logtext_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
notify = "8"
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.3"
trash = "5.2.6"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
debug = false
strip = "symbols"
