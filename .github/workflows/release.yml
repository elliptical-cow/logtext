name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: release-verify
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form v1.2.3; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Test frontend
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: release-build-${{ matrix.kind }}
    needs: verify
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            kind: windows
            bundle_args: "--bundles nsis"
          - platform: macos-latest
            kind: macos
            bundle_args: "--target universal-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            kind: linux
            bundle_args: "--bundles appimage,deb"

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.kind == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release bundles
        run: npm run tauri build -- ${{ matrix.bundle_args }}

      - name: Stage Windows release assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "src-tauri/target/release/Logtext.exe" "release-assets/Logtext-${version}-windows-x86_64-portable.exe"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -File -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not created"
          }
          Copy-Item $installer.FullName "release-assets/Logtext-${version}-windows-x86_64-setup.exe"

      - name: Stage macOS release asset
        if: matrix.kind == 'macos'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          app_path=$(find src-tauri/target -type d -name "Logtext.app" | head -1)
          test -n "$app_path"
          ditto -c -k --keepParent "$app_path" "release-assets/Logtext-${version}-macos-universal-app.zip"

      - name: Stage Linux release assets
        if: matrix.kind == 'linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          thin_dir=$(mktemp -d)
          trap 'rm -rf "$thin_dir"' EXIT
          appimage_path=$(find src-tauri/target/release/bundle -type f -name "*.AppImage" | head -1)
          deb_path=$(find src-tauri/target/release/bundle -type f -name "*.deb" | head -1)
          test -n "$appimage_path"
          test -n "$deb_path"
          cp "$appimage_path" "release-assets/Logtext-${version}-linux-x86_64.AppImage"
          cp "$deb_path" "release-assets/Logtext-${version}-linux-x86_64.deb"
          install -m 0755 src-tauri/target/release/Logtext "$thin_dir/Logtext"
          install -m 0644 packaging/linux-thin/README.txt "$thin_dir/README.txt"
          install -m 0644 LICENSE "$thin_dir/LICENSE"
          tar -czf "release-assets/Logtext-${version}-linux-x86_64-thin.tar.gz" \
            -C "$thin_dir" Logtext README.txt LICENSE

      - name: Upload staged release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.kind }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: release-publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Logtext v$version" \
            --generate-notes
